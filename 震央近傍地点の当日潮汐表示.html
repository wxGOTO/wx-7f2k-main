function proxyUrl(url){ const p = $(&#x27;proxyUrl&#x27;).value.trim(); return p ? p + encodeURIComponent(url) : url; }
async function fetchText(url){
  try{
    const r = await fetch(url, {cache:&#x27;no-store&#x27;});
    if(!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    return await r.text();
  }catch(e){
    const p = $(&#x27;proxyUrl&#x27;).value.trim();

      log(`直接取得失敗。プロキシで再試行: ${e.message}`);

      if(!r.ok) throw new Error(`proxy ${r.status} ${r.statusText}`);
      return await r.text();
    }
    throw e;
  }
}
async function fetchJson(url){ return JSON.parse(await fetchText(url)); }
function parseDMS(deg,min){ return Number(deg)+Number(min)/60; }
function cleanName(s){
  return String(s ?? &#x27;&#x27;)
    .replace(/【[^†】]*†([^】]+)】/g,&#x27;$1&#x27;)   // web抽出時の「【11†稚内】」対策
    .replace(/[【】]/g,&#x27;&#x27;)
    .replace(/^[\s\d†]+/g,&#x27;&#x27;)
    .replace(/\s+/g,&#x27;&#x27;)
    .trim();
}
function parseStationLine(tx){
  const line = String(tx ?? &#x27;&#x27;).replace(/\u00a0/g,&#x27; &#x27;).replace(/\s+/g,&#x27; &#x27;).trim();
  // 例1: 1 WN 稚内 45゜24&#x27; 141゜41&#x27;
  // 例2: 1 WN【11†稚内】 45゜24&#x27; 141゜41&#x27;
  const m = line.match(/^\s*(\d{1,3})\s+([A-Z0-9]{2})\s*(?:【[^†】]*†([^】]+)】|(.+?))\s+(\d{2})[゜°]\s*(\d{2})[&#x27;′’]\s+(\d{3})[゜°]\s*(\d{2})[&#x27;′’]/);
  if(!m) return null;
  const code = m[2];
  const rawName = m[3] || m[4] || &#x27;&#x27;;
  const name = cleanName(rawName);
  if(!code || !name) return null;
  return {code, name, lat:parseDMS(m[5],m[6]), lon:parseDMS(m[7],m[8])};
}
function parseStationsFromHtml(html){
  const doc = new DOMParser().parseFromString(html, &#x27;text/html&#x27;);
  const stations = [];

  // まずHTMLの表行から読む。通常ブラウザではこちらが本命。
  for(const tr of Array.from(doc.querySelectorAll(&#x27;tr&#x27;))){
    const tx = tr.textContent || &#x27;&#x27;;
    const s = parseStationLine(tx);
    if(s) stations.push(s);
  }

  // 表行で取れない環境向け。ページ全文から行単位で再解析。
  if(stations.length &lt; 150){
    const text = (doc.body ? doc.body.textContent : html)
      .replace(/\u00a0/g,&#x27; &#x27;)
      .replace(/\r/g,&#x27;\n&#x27;);
    for(const line of text.split(&#x27;\n&#x27;).map(x=&gt;x.trim()).filter(Boolean)){
      const s = parseStationLine(line);
      if(s) stations.push(s);
    }
  }

  // 最後の保険。改行が消えているプロキシ応答向けに、全文へ正規表現をかける。
  if(stations.length &lt; 150){
    const text = (doc.body ? doc.body.textContent : html).replace(/\u00a0/g,&#x27; &#x27;).replace(/\s+/g,&#x27; &#x27;);
    const re = /(?:^|\s)(\d{1,3})\s+([A-Z0-9]{2})\s*(?:【[^†】]*†([^】]+)】|(.{1,28}?))\s+(\d{2})[゜°]\s*(\d{2})[&#x27;′’]\s+(\d{3})[゜°]\s*(\d{2})[&#x27;′’]/g;
    let m;
    while((m = re.exec(text)) !== null){
      const code = m[2];
      const name = cleanName(m[3] || m[4] || &#x27;&#x27;);
      if(code &amp;&amp; name) stations.push({code,name,lat:parseDMS(m[5],m[6]),lon:parseDMS(m[7],m[8])});
    }
  }

  const seen = new Set();
  return stations.filter(s=&gt;{
    const k=s.code+&#x27;|&#x27;+s.name;
    if(seen.has(k))return false;
    seen.add(k);
    return Number.isFinite(s.lat) &amp;&amp; Number.isFinite(s.lon);

    $(&#x27;quakeSelect&#x27;).innerHTML=quakeItems.map((q,i)=&gt;`&lt;option value=&quot;${i}&quot;&gt;${esc(q.title||q.name||q.reportDatetime||q.json||(&#x27;地震 &#x27;+(i+1)))}&lt;/option&gt;`).join(&#x27;&#x27;);
    log(`地震リスト ${quakeItems.length}件を取得`);
    await loadSelectedQuake();
    await showNearestOnly();
  }catch(e){
    log(&#x27;地震リスト取得失敗: &#x27;+e.message);
    $(&#x27;quakeSelect&#x27;).innerHTML=&#x27;&lt;option&gt;取得失敗&lt;/option&gt;&#x27;;
  }finally{$(&#x27;btnLoadQuakes&#x27;).disabled=false;}
}
$(&#x27;btnLoadStations&#x27;).addEventListener(&#x27;click&#x27;, async()=&gt;{ await loadStations(); await showNearestOnly(); });
$(&#x27;btnClearLog&#x27;).addEventListener(&#x27;click&#x27;, ()=&gt;$(&#x27;log&#x27;).textContent=&#x27;&#x27;);
$(&#x27;btnLoadQuakes&#x27;).addEventListener(&#x27;click&#x27;, loadQuakes);
$(&#x27;quakeSelect&#x27;).addEventListener(&#x27;change&#x27;, loadSelectedQuake);
$(&#x27;btnUseManualCenter&#x27;).addEventListener(&#x27;click&#x27;, ()=&gt;{
  const lat = Number($(&#x27;manualLat&#x27;).value);
  const lon = Number($(&#x27;manualLon&#x27;).value);
  if(!Number.isFinite(lat) || !Number.isFinite(lon) || lat &lt; -90 || lat &gt; 90 || lon &lt; -180 || lon &gt; 180){
    $(&#x27;quakeInfo&#x27;).innerHTML=&#x27;&lt;span class=&quot;pill warn&quot;&gt;任意中心座標が不正です&lt;/span&gt;&#x27;;
    log(&#x27;任意中心座標が不正です。緯度は -90〜90、経度は -180〜180 で入力してください。&#x27;);
    return;
  }
  $(&#x27;lat&#x27;).value = lat.toFixed(3);
  $(&#x27;lon&#x27;).value = lon.toFixed(3);
  $(&#x27;quakeInfo&#x27;).innerHTML=`&lt;span class=&quot;pill&quot;&gt;任意の中心座標を使用&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;座標: ${lat.toFixed(3)}, ${lon.toFixed(3)}&lt;/span&gt;`;
  log(`任意の中心座標を使用: ${lat.toFixed(3)}, ${lon.toFixed(3)}`);
  showNearestOnly();
});
$(&#x27;btnNearestOnly&#x27;).addEventListener(&#x27;click&#x27;, showNearestOnly);
$(&#x27;btnNearest&#x27;).addEventListener(&#x27;click&#x27;, fetchTides);
$(&#x27;stationCount&#x27;).addEventListener(&#x27;change&#x27;, showNearestOnly);
loadStations().then(showNearestOnly);
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></section>
  <div class="divider" id="divider" title="ドラッグで幅調整"></div>
  <section class="pane"><iframe id="rightFrame" title="気象庁 地震情報" src="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map"></iframe></section>
</div>
<script>
'use strict';
const jmaUrl = 'https://www.jma.go.jp/bosai/map.html#contents=earthquake_map';
const right = document.getElementById('rightFrame');
document.getElementById('reloadRight').addEventListener('click',()=>{ right.src = jmaUrl; });

const wrap = document.getElementById('wrap');
const div = document.getElementById('divider');
let dragging = false;
div.addEventListener('pointerdown', e => { dragging = true; div.setPointerCapture(e.pointerId); });
div.addEventListener('pointerup', e => { dragging = false; try{div.releasePointerCapture(e.pointerId)}catch(_){} });
div.addEventListener('pointercancel', () => dragging = false);
div.addEventListener('pointermove', e => {
  if(!dragging) return;
  const r = wrap.getBoundingClientRect();
  if(window.innerWidth <= 900){
    const y = Math.max(220, Math.min(r.height-220, e.clientY-r.top));
    wrap.style.gridTemplateRows = `${y}px 8px 1fr`;
  }else{
    const x = Math.max(360, Math.min(r.width-360, e.clientX-r.left));
    wrap.style.gridTemplateColumns = `${x}px 8px 1fr`;
    const lab = document.querySelector('.label.right');
    if(lab) lab.style.left = `${x+20}px`;
  }
});
</script>
</body>
</html>
