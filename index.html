<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>気象・地震ツール</title>

<style>
:root{
  --bg:#0b1220;
  --card:#121c2f;
  --card2:#17253d;
  --line:rgba(255,255,255,.08);
  --text:#f3f6fb;
  --muted:#a9b4c7;
  --accent:#4da3ff;
  --accent2:#68e1fd;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:
    radial-gradient(circle at top right,#1d3557 0%,#0b1220 45%),
    #0b1220;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:42px 20px 24px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:clamp(28px,5vw,44px);
  letter-spacing:.03em;
}

header p{
  margin:14px auto 0;
  max-width:780px;
  color:var(--muted);
  line-height:1.8;
  font-size:15px;
}

main{
  width:min(1100px,calc(100% - 24px));
  margin:0 auto 40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;
}

.card{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:22px;
  padding:22px;
  box-shadow:
    0 12px 30px rgba(0,0,0,.35);
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(104,225,253,.35);
  box-shadow:
    0 18px 40px rgba(0,0,0,.42);
}

.icon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:
    linear-gradient(135deg,#22406d,#10203b);
  margin-bottom:18px;
}

.card h2{
  margin:0 0 12px;
  font-size:24px;
}

.card p{
  margin:0 0 18px;
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:22px;
}

.tag{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:#dce7f8;
  border:1px solid rgba(255,255,255,.06);
}

.open-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:white;
  background:
    linear-gradient(135deg,var(--accent),var(--accent2));
  padding:14px 18px;
  border-radius:14px;
  font-weight:700;
  box-shadow:
    0 8px 20px rgba(77,163,255,.28);
}

.open-btn:hover{
  filter:brightness(1.06);
}

footer{
  margin-top:auto;
  text-align:center;
  padding:18px;
  color:#91a0b7;
  font-size:12px;
}

.note{
  width:min(1100px,calc(100% - 24px));
  margin:0 auto 20px;
  padding:16px 18px;
  border-radius:16px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
  color:#c8d3e3;
  line-height:1.8;
  font-size:13px;
}

@media (max-width:640px){

  header{
    padding-top:30px;
  }

  .card{
    padding:18px;
  }

  .card h2{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header>
  <h1>気象・地震ツール</h1>

  <p>
    地図表示、日の出・日の入境界線、地震情報、潮汐情報をブラウザだけで表示できます。
  </p>
</header>

<main>

  <section class="card">

    <div class="icon">🌍</div>

    <h2>夜の境界線 地理院地図版</h2>

    <p>
      地理院地図上に、日の出側・日の入側の境界線を描画します。<br>
      時刻格子線、薄明、現在時刻表示にも対応しています。
    </p>

    <div class="tags">
      <span class="tag">地理院地図</span>
      <span class="tag">日の出</span>
      <span class="tag">日の入</span>
      <span class="tag">薄明</span>
      <span class="tag">時刻格子</span>
    </div>

    <a class="open-btn" href="sunrise_grid.html">
      開く →
    </a>

  </section>

  <section class="card">

    <div class="icon">🌊</div>

    <h2>震央近傍 潮汐表示</h2>

    <p>
      気象庁の地震情報から震央付近を取得し、
      近傍地点の潮汐情報を一覧表示します。<br>
      任意座標入力にも対応しています。
    </p>

    <div class="tags">
      <span class="tag">地震情報</span>
      <span class="tag">潮汐</span>
      <span class="tag">気象庁</span>
      <span class="tag">震央</span>
      <span class="tag">任意座標</span>
    </div>

    <a class="open-btn" href="tide_quake_jma_button.html">
      開く →
    </a>

  </section>

</main>

<footer>
  HTML単体動作版
</footer>

</body>
</html>
