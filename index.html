<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地震・潮汐ツールランチャー</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --line:#334155;
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#38bdf8;
  --accent2:#818cf8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top right,#1e293b 0%,#0f172a 45%),
    #0f172a;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.wrap{
  width:min(1100px,100%);
}

header{
  text-align:center;
  margin-bottom:32px;
}

h1{
  margin:0 0 12px;
  font-size:clamp(28px,5vw,48px);
  letter-spacing:.04em;
}

.sub{
  color:var(--muted);
  font-size:15px;
  line-height:1.8;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.card{
  position:relative;
  overflow:hidden;
  background:rgba(17,24,39,.92);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  text-decoration:none;
  color:inherit;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
  backdrop-filter:blur(10px);
}

.card:hover{
  transform:translateY(-6px);
  border-color:var(--accent);
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(56,189,248,.12),
      rgba(129,140,248,.10)
    );
  pointer-events:none;
}

.icon{
  font-size:54px;
  margin-bottom:18px;
}

.title{
  font-size:24px;
  font-weight:700;
  margin-bottom:12px;
}

.desc{
  color:var(--muted);
  line-height:1.8;
  font-size:14px;
}

.badge{
  display:inline-block;
  margin-top:18px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(56,189,248,.12);
  color:#7dd3fc;
  font-size:13px;
  font-weight:700;
}

footer{
  margin-top:32px;
  text-align:center;
  color:#64748b;
  font-size:12px;
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h1>地震・潮汐ツール</h1>

  <div class="sub">
    地震情報と潮汐情報を表示するツール集<br>
    使用したい機能を選択してください
  </div>
</header>

<section class="grid">

  <a class="card"
     href="./震央近傍地点の当日潮汐表示.html">

    <div class="icon">🌊</div>

    <div class="title">
      震央近傍地点の当日潮汐表示
    </div>

    <div class="desc">
      地震の震央付近にある潮位観測地点を抽出し、
      当日の満潮・干潮・潮回りを表示します。
    </div>

    <div class="badge">
      潮汐解析
    </div>

  </a>

  <a class="card"
     href="./地震地点を取得して潮汐.html">

    <div class="icon">🌎</div>

    <div class="title">
      地震地点取得＋潮汐表示
    </div>

    <div class="desc">
      地震地点情報を取得し、
      近傍地点の潮汐情報を連携表示します。
    </div>

    <div class="badge">
      地震連携
    </div>

  </a>

</section>

<footer>
  Local HTML Launcher
</footer>

</div>

</body>
</html>
